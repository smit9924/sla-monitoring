services:
  postgres:
    image: postgres:16
    container_name: sla-monitoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sla_admin
      POSTGRES_PASSWORD: sla_admin_password
      POSTGRES_DB: sla_monitoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
