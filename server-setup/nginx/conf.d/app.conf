server {
    listen 80;
    listen [::]:80;

    server_name slamonitoring.hospitia.in;

    root /usr/share/nginx/html;
    index index.html;

    # Angular build output is hashed per file (main-XXXX.js, styles-XXXX.css),
    # so these can be cached aggressively; index.html itself must not be, or
    # browsers would keep serving stale references to old hashed filenames.
    location ~ \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
