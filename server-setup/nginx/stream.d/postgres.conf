# TCP passthrough for db.slamonitoring.hospitia.in:5432 -> the Postgres
# container. Postgres speaks its own wire protocol, not HTTP, so this lives
# in the stream (L4) context rather than a conf.d server block. There is no
# hostname-based routing here (that would need TLS SNI); every connection
# that reaches this port is forwarded to Postgres.
server {
    listen 5432;
    proxy_pass sla-monitoring-postgres:5432;
}
